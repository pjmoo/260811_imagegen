<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>이미지 생성</title>
</head>
<body>
<h1>이미지 만들어봅시다!</h1>
<section>
    <form th:action="@{/gen}" method="post">
        <input type="text"
               name="prompt"
               placeholder="이미지 생성할 내용을 입력해주세요 (500자 이내)"
               maxlength="500"
               required
        >
        <button>이미지 생성</button>
    </form>
</section>
</body>
</html>
