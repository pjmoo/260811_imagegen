<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>이미지 생성</title>
</head>
<body>
<h1>이미지 만들어봅시다!</h1>
<section>
    <form th:action="@{/gen}" method="post">
        <input type="text"
               name="prompt"
               placeholder="이미지 생성할 내용을 입력해주세요 (500자 이내)"
               maxlength="500"
               required
        >
        <button>이미지 생성</button>
    </form>
</section>
<section th:if="${result}">
    <!--/* [[${result}]] */-->
    <!--/* [[${result.result.image}]] */-->
    <!--/* <img th:src="'data:image/jpeg;base64,' + ${result.result.image}" */-->
    <!--/* width="240" alt="생성된 이미지"> */-->
    <p>직접 입력한 프롬프트 : [[${result.prompt}]]</p>
    <p>번역/개선된 프롬프트 : [[${result.improved}]]</p>
    <img th:src="@{/gen/{f}(f=${result.filename})}" width="240" alt="생성된 이미지">
</section>

<section th:unless="${images.isEmpty()}">
    <hr>
    <div th:each="image : ${images}">
        <p>직접 입력한 프롬프트 : [[${image.prompt}]]</p>
        <p>번역/개선된 프롬프트 : [[${image.improved}]]</p>
        <img th:src="@{/gen/{f}(f=${image.filename})}" width="240" alt="생성된 이미지">
    </div>
</section>
</body>
</html>
